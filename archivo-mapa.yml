# =============================================================================
# VERIFICAR — Datos pendientes de confirmar con hardware real
# =============================================================================
pendientes_verificar:
  - id: "PV1"
    dato: "¿Pot real es tipo B (lineal) o tipo A (logarítmico)?"
    impacto: "Curva de velocidad correcta"
    como_verificar: "Leer marca del pot. Si dice 'B10K' = lineal. Si dice 'A10K' = log"

  - id: "PV2"
    dato: "¿Colores cable motor = Rojo-Azul-Verde-Negro?"
    impacto: "Conexión correcta al driver (evitar cortocircuito de bobinas)"
    como_verificar: "Multímetro en modo resistencia: pares con ~1.65Ω = misma bobina"

  - id: "PV3"
    dato: "¿Fuente 12V entrega estable bajo carga 1.68A?"
    impacto: "Motor pierde pasos si voltaje baja"
    como_verificar: "Medir VMOT en driver CON motor girando a velocidad máxima"

  - id: "PV4"
    dato: "¿Rsense del A4988 específico es 0.100Ω o 0.050Ω?"
    impacto: "VREF cambia: con 0.050Ω → VREF = 0.67V"
    como_verificar: "Buscar resistor marcado R100 o R050 en PCB del driver"

  - id: "PV5"
    dato: "¿Poleas GT2 ya compradas?"
    impacto: "Sin reducción: torque insuficiente para carga vertical"
    como_verificar: "Confirmar con estudiantes"
