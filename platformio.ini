; PlatformIO Project Configuration
; Posicionador Motorizado NEMA17 — Colegio Nacional San Luis, Tarija
; Boards soportadas: Arduino Uno R3 y Arduino Nano (ambas ATmega328P)

[platformio]
default_envs = uno, prueba_uno

; === ARDUINO UNO R3 (Hardware actual comprado) ===
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_filter = +<*.cpp> -<prueba_serial.cpp>
build_flags =
    -DVERSION_MAJOR=2
    -DVERSION_MINOR=0
    -DLCD_ENABLED=0
    -DDEBUG_SERIAL=1

[env:prueba_uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<prueba_serial.cpp>

; === ARDUINO NANO (Compatibilidad anterior) ===
[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
upload_speed = 115200
build_src_filter = +<*.cpp> -<prueba_serial.cpp>
build_flags =
    -DVERSION_MAJOR=2
    -DVERSION_MINOR=0
    -DLCD_ENABLED=0
    -DDEBUG_SERIAL=1

[env:prueba_nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = -<*> +<prueba_serial.cpp>


