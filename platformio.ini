; PlatformIO Project Configuration
; Posicionador Motorizado NEMA17 — Colegio Nacional San Luis, Tarija
; Board: Arduino Nano (ATmega328P)

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
upload_speed = 115200
build_flags =
    -DVERSION_MAJOR=2
    -DVERSION_MINOR=0
    -DLCD_ENABLED=0
    -DDEBUG_SERIAL=1
